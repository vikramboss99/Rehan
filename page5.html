<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catch the Stars • Zayn</title><link rel="stylesheet" href="style.css"></head><body data-page="5"><main class="wrap"><span class="eyebrow">Chapter 05 • Your birthday galaxy</span><h2>Catch the Falling Stars 🌠</h2><p>Catch 10 stars before they disappear. Tap the stars as they fall!</p><div class="glass"><h2>⭐ <span id="score">0</span> / 10</h2><div class="star-field" id="field"></div><p id="msg">Ready, birthday star?</p><button class="btn" id="start">Start the game</button><button class="btn" id="continue" style="display:none" onclick="next(6)">The grand finale →</button></div><div id="nav" class="nav"></div></main><script src="app.js"></script><script>let score=0,timer;$('#start').onclick=()=>{$('#start').style.display='none';$('#msg').textContent='Catch them!';timer=setInterval(()=>{let s=document.createElement('button');s.className='falling';s.textContent='⭐';s.style.top='-45px';s.style.left=(Math.random()*85+5)+'%';s.setAttribute('aria-label','Catch falling star');s.onclick=()=>{s.remove();score++;$('#score').textContent=score;sound('magic');if(score>=10){clearInterval(timer);$('#field').innerHTML='';$('#msg').textContent='You caught your birthday galaxy! 🌌';$('#continue').style.display='inline-block';confetti(90)}};$('#field').appendChild(s);setTimeout(()=>s.remove(),3500)},650)}</script></body></html>
