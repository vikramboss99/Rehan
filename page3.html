<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Wishes • Zayn</title><link rel="stylesheet" href="style.css"></head><body data-page="3"><main class="wrap"><span class="eyebrow">Chapter 03 • Hidden treasures</span><h2>Six Wishes, Just for You 💌</h2><p>Tap each mystery card to reveal a wish. Reveal them all to continue.</p><div class="glass"><div class="grid" id="cards"></div><p id="msg">0 of 6 wishes revealed</p><button class="btn" id="continue" disabled onclick="next(4)">On to the mystery quiz →</button></div><div id="nav" class="nav"></div></main><script src="app.js"></script><script>let wishes=['More adventures 🌍','Endless laughter 😄','Big dreams ✨','True friendships 💗','Beautiful memories 🌸','An amazing year 🎂'],opened=0;wishes.forEach((w,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=['🎁','💌','🌟','🎀','💎','🎊'][i];b.setAttribute('aria-label','Reveal wish '+(i+1));b.onclick=()=>{if(b.classList.contains('revealed'))return;b.classList.add('revealed');b.textContent=w;opened++;sound('magic');$('#msg').textContent=opened+' of 6 wishes revealed';if(opened===6){$('#continue').disabled=false;confetti(55)}};$('#cards').appendChild(b)})</script></body></html>
