<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Quiz • Zayn</title><link rel="stylesheet" href="style.css"></head><body data-page="4"><main class="wrap"><span class="eyebrow">Chapter 04 • Birthday brain teaser</span><h2>The Birthday Quiz 🧠</h2><p>Three fun questions. No pressure, just birthday vibes!</p><div class="glass"><p class="eyebrow" id="number">Question 1 of 3</p><p class="question" id="question"></p><div class="options" id="options"></div><p id="feedback"></p><button class="btn" id="continue" style="display:none" onclick="next(5)">Collect your stars →</button></div><div id="nav" class="nav"></div></main><script src="app.js"></script><script>const questions=[{q:'What is the most important ingredient in a birthday?',o:['A mountain of homework','Joy and people who care','An alarm clock'],a:1},{q:'What should Zayn wish for today?',o:['Only good vibes and big dreams','More Mondays','A boring year'],a:0},{q:'How many wishes can you make today?',o:['Just one','As many as your heart wants','Zero'],a:1}];let i=0,points=0;function render(){if(i===3){$('#number').textContent='Quiz complete!';$('#question').textContent='You scored '+points+'/3 🌟';$('#options').innerHTML='';$('#feedback').textContent='Your mystery gift is a sky full of stars!';$('#continue').style.display='inline-block';confetti();return}$('#number').textContent='Question '+(i+1)+' of 3';$('#question').textContent=questions[i].q;$('#options').innerHTML='';$('#feedback').textContent='';questions[i].o.forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{if(j===questions[i].a)points++;sound('magic');i++;render()};$('#options').appendChild(b)})}render()</script></body></html>
