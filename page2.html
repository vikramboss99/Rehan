<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop the Balloons • Zayn</title><link rel="stylesheet" href="style.css"></head><body data-page="2"><main class="wrap"><span class="eyebrow">Chapter 02 • A little game</span><h2>Pop the Birthday Balloons 🎈</h2><p>Pop all 8 balloons to unlock the next birthday surprise!</p><div class="glass"><h2><span id="score">0</span> / 8</h2><div class="meter"><div id="progress" style="width:0%"></div></div><div class="balloon-field" id="field"></div><p id="msg">Each balloon carries a little bit of birthday magic.</p><button class="btn" id="continue" disabled onclick="next(3)">Unlock the next chapter →</button></div><div id="nav" class="nav"></div></main><script src="app.js"></script><script>let field=$('#field'),score=0;for(let i=0;i<8;i++){let b=document.createElement('button');b.className='balloon';b.textContent=['🎈','🎈','🎈','🎈'][i%4];b.style.left=(7+(i%4)*23)+'%';b.style.top=(i<4?15:58)+(i%2*8)+'%';b.style.animationDelay=(i*.3)+'s';b.setAttribute('aria-label','Pop balloon');b.onclick=()=>{b.remove();score++;sound();$('#score').textContent=score;$('#progress').style.width=score/8*100+'%';if(score===8){$('#msg').textContent='Amazing! You popped every balloon. 🎉';$('#continue').disabled=false;confetti()}};field.appendChild(b)}</script></body></html>
